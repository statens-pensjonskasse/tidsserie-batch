name: Bygg og release artifakt med Maven
on:
  push:
  workflow_dispatch:
jobs:
  build:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-library-maven.yaml@2542126131d52bcac3e8d08fea5e85fc3e84911a # v0.3.7
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      java-version: '25'
      require-release-flag: true # Lag release hvis commit har [release] i commit-meldingen