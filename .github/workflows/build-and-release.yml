name: Bygg og release artifakt med Maven
on:
  push:
  workflow_dispatch:
jobs:
  build:
    uses: statens-pensjonskasse/public-actions-library/.github/workflows/build-library-maven.yaml@4bbd47023c53914a01c3a99ee4a6b4703cafb143 # v0.3.10
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      java-version: '25'
      require-release-flag: true # Lag release hvis commit har [release] i commit-meldingen